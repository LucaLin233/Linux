name: Shell tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: shell-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Verify test dependencies
        run: |
          command -v shellcheck
          shellcheck --version

      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run ShellCheck
        shell: bash
        run: |
          # All tracked Bash scripts outside tests are production by default.
          # Both groups lint in parallel, one file per process, and both are
          # started before the first wait so a failure in one cannot hide the
          # other.  pipefail stays on, so a failed file enumeration fails its
          # group even though xargs then sees empty input; any failure becomes
          # a single exit 1.
          set -o pipefail
          status=0
          git ls-files -z -- "*.sh" ":!:tests/**" | xargs -0 -r -n1 -P4 shellcheck -x --severity=warning -- &
          production_pid=$!
          git ls-files -z -- "tests/*.sh" | xargs -0 -r -n1 -P4 shellcheck -x --severity=error -- &
          test_pid=$!
          wait "$production_pid" || status=1
          wait "$test_pid" || status=1
          exit "$status"

  ubuntu-tests:
    name: Ubuntu 24.04 / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # motd is cut into eleven segments spread over three jobs of four,
          # four and three; push-worker is cut into seven, two jobs of four and
          # three; cloudflare is cut into eight, two jobs of four.
          - shard: motd-a
            suite: motd
            segments: 11
            segment_set: "0 1 2 3"
          - shard: motd-b
            suite: motd
            segments: 11
            segment_set: "4 5 6 7"
          - shard: motd-c
            suite: motd
            segments: 11
            segment_set: "8 9 10"
          - shard: push-worker-a
            suite: push-worker
            segments: 7
            segment_set: "0 1 2 3"
          - shard: push-worker-b
            suite: push-worker
            segments: 7
            segment_set: "4 5 6"
          - shard: push
            suite: push
            segments: 1
          - shard: cloudflare-a
            suite: cloudflare
            segments: 8
            segment_set: "0 1 2 3"
          - shard: cloudflare-b
            suite: cloudflare
            segments: 8
            segment_set: "4 5 6 7"
          - shard: other
            suite: other
            segments: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify test dependencies
        run: |
          command -v jq
          command -v ip
          command -v rsync
          command -v ssh

      - name: Verify checkout and real Git selection
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
          bash tests/test-selection-git.sh

      - name: Run tests
        env:
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SUITE: ${{ matrix.suite }}
          TEST_SEGMENTS: ${{ matrix.segments }}
          TEST_SEGMENT_SET: ${{ matrix.segment_set }}
        run: bash tests/run.sh "$TEST_SUITE"

  debian-tests:
    name: Debian 13 / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # motd is cut into eleven segments spread over three jobs of four,
          # four and three; push-worker is cut into seven, two jobs of four and
          # three; cloudflare is cut into eight, two jobs of four.
          - shard: motd-a
            suite: motd
            segments: 11
            segment_set: "0 1 2 3"
          - shard: motd-b
            suite: motd
            segments: 11
            segment_set: "4 5 6 7"
          - shard: motd-c
            suite: motd
            segments: 11
            segment_set: "8 9 10"
          - shard: push-worker-a
            suite: push-worker
            segments: 7
            segment_set: "0 1 2 3"
          - shard: push-worker-b
            suite: push-worker
            segments: 7
            segment_set: "4 5 6"
          - shard: push
            suite: push
            segments: 1
          - shard: cloudflare-a
            suite: cloudflare
            segments: 8
            segment_set: "0 1 2 3"
          - shard: cloudflare-b
            suite: cloudflare
            segments: 8
            segment_set: "4 5 6 7"
          - shard: other
            suite: other
            segments: 1
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git iproute2 jq openssh-client rsync

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and real Git selection
        shell: bash
        run: |
          # Checkout uses a temporary HOME; trust only this job's workspace.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
          bash tests/test-selection-git.sh

      - name: Check Bash syntax
        if: matrix.shard == 'other'
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run tests
        env:
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SUITE: ${{ matrix.suite }}
          TEST_SEGMENTS: ${{ matrix.segments }}
          TEST_SEGMENT_SET: ${{ matrix.segment_set }}
        run: bash tests/run.sh "$TEST_SUITE"

  # Preserve existing required-check names; skipped/cancelled dependencies fail closed.
  ubuntu:
    name: Ubuntu 24.04 lint and tests
    if: ${{ always() }}
    needs: [lint, ubuntu-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require lint and every Ubuntu shard
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.ubuntu-tests.result }}
        run: test "$LINT_RESULT" = success && test "$TEST_RESULT" = success

  debian-13:
    name: Debian 13 tests
    if: ${{ always() }}
    needs: [debian-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Debian shard
        env:
          TEST_RESULT: ${{ needs.debian-tests.result }}
        run: test "$TEST_RESULT" = success
