name: Shell tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Verify test dependencies
        run: |
          command -v shellcheck
          command -v jq
          command -v ip
          command -v rsync
          command -v ssh

      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run ShellCheck
        run: shellcheck -x --severity=error linux_setup.sh modules/*.sh tools/*.sh tests/*.sh

      - name: Run tests
        run: bash tests/run.sh

  debian-13:
    name: Debian 13 tests
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bash ca-certificates coreutils git iproute2 jq openssh-client rsync util-linux

      - uses: actions/checkout@v7

      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run tests
        run: bash tests/run.sh
