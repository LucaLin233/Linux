name: ShellCheck inventory
on:
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/sc.tar.xz"
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          git ls-files -z -- '*.sh' | xargs -0 -r "$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck" -x --severity=warning --
